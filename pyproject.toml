[project]
name = "cx-preflight-edge"
version = "0.1.0"
description = "폐쇄망 데이터센터 통합시운전 시험절차 사전검증 및 텔레메트리 근거화 (on-device, Qualcomm QCS9075)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Yeongje Kim" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cxpe = "cxpe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cxpe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
